name: Release

on:
  push:
    branches: [main]
    # Binaries are not committed: every tag builds them and attaches them to
    # its GitHub release, whether release-please made the tag or a person did.
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    # A tag push is already a release; release-please only opens and lands
    # release PRs from the branch.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release-tag:
    name: Resolve Release Tag
    # `!cancelled()`: release-please is skipped on a tag push, and a skipped
    # dependency would otherwise skip everything that needs it.
    if: ${{ !cancelled() }}
    needs: release-please
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Pick the tag to publish
        env:
          RELEASE_PLEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
        id: pick
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_CREATED" = true ]; then
            echo "tag=$RELEASE_PLEASE_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the tag
        if: steps.pick.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.pick.outputs.tag }}

      # A hand-pushed tag is the one path where nothing has bumped Cargo.toml,
      # and a binary whose --version disagrees with its release is worse than
      # no release at all. Checked once, before any platform builds.
      - name: Check the crate version matches the tag
        if: steps.pick.outputs.tag != ''
        env:
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$crate_version" != "${TAG#v}" ]; then
            echo "Cargo.toml is $crate_version but the tag is $TAG." >&2
            echo "Bump the version (and .release-please-manifest.json) in the tagged commit." >&2
            exit 1
          fi

      # Once, here: the matrix jobs racing to create the same release would
      # leave the losers failed and their platform's assets missing.
      - name: Ensure the release exists
        if: steps.pick.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pick.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --generate-notes

  build-binaries:
    name: Build Release Binaries
    needs: release-tag
    # `!cancelled()` again: a skipped job cascades down the whole chain, and
    # release-please is skipped on every tag, so without it nothing builds.
    if: ${{ !cancelled() && needs.release-tag.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.release-tag.outputs.tag }}

  update-packaging:
    name: Bump Homebrew Formula and Scoop Manifest
    needs: [release-tag, build-binaries]
    # Only once every platform's assets and checksums are on the release.
    if: ${{ !cancelled() && needs.build-binaries.result == 'success' && needs.release-tag.outputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # main, not the tag: the bump is committed on top of the release.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Regenerate manifests from the release checksums
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
        # A hand-pushed tag can be older than what main already ships; never
        # roll the manifests back to it.
        run: |
          current="$(jq -r .version bucket/claude-code-sync.json)"
          newest="$(printf '%s\n%s\n' "$current" "${TAG#v}" | sort -V | tail -n 1)"
          if [ "$newest" != "${TAG#v}" ]; then
            echo "Manifests already at $current, newer than $TAG; leaving them alone"
            exit 0
          fi
          scripts/update-packaging.sh "$TAG"

      # `ci:` is a hidden changelog section, so release-please does not treat
      # this commit as release-worthy (chore: would open another release PR).
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so no CI loop.
      - name: Commit and push
        env:
          TAG: ${{ needs.release-tag.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula bucket
          if git diff --cached --quiet; then
            echo "Manifests already up to date"
            exit 0
          fi
          git commit -m "ci(packaging): bump Homebrew formula and Scoop manifest to $TAG"
          # Something may have merged to main while the binaries were building.
          git pull --rebase origin main
          git push origin HEAD:main

  publish-crate:
    name: Publish to crates.io
    needs: [release-please, build-binaries]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install mise
        uses: jdx/mise-action@v4

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Verify package
        run: cargo package --verbose

      # No prerelease gating: release-please's default versioning never emits
      # alpha/beta/rc tags, so every release it creates is publishable.
      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  docker:
    name: Build and Push Docker Image
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The triggering event is a branch push, not a tag push, so semver tags
      # must be derived explicitly from the release-please tag.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
